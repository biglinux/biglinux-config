name: Build Package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Test, validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test, build and install in a clean Arch Linux container
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD:/src" archlinux:latest bash /src/tools/ci.sh /src /src/dist

      - uses: actions/upload-artifact@v4
        with:
          name: biglinux-config-package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  dispatch:
    name: Send to BigLinux Package Build
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch x86_64 and ARM builds
        env:
          TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          PAYLOAD: '{"event_type": "${{ github.repository }}", "client_payload": {"branch": "${{ github.ref_name }}", "url": "https://github.com/${{ github.repository }}"}}'
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::WEBHOOK_TOKEN is not configured for this repository; skipping the dispatch."
            exit 0
          fi
          for repo in build-package build-package-ARM; do
            curl --fail-with-body --silent --show-error -X POST \
              -H "Accept: application/json" -H "Authorization: token $TOKEN" \
              --data "$PAYLOAD" "https://api.github.com/repos/BigLinux-Package-Build/$repo/dispatches"
          done
